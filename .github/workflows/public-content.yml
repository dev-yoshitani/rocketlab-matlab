name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 tools/check_public.py
      - run: python3 -m unittest discover -s tests -p 'test_public_content.py' -v
